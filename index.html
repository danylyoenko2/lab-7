<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 7</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        height: 100dvh;
        background-color: #101217;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 100px;
      }

      form {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      label {
        position: relative;
        padding: 10px 16px 10px 8px;
        width: 230px;
        border: 3px solid #5f4666;
        background-color: #fff;
        border-radius: 12px;
        overflow: hidden;
        cursor: text;
        transition: border-color 0.3s ease;

        &:hover {
          border-color: #682d9c;

          &::before {
            transform: translateX(0);
          }

          &::after {
            transform: translateX(200%);
          }

          .ask__deco {
            transform: translateX(0);
          }
        }

        &:focus-within {
          border-color: #682d9c;

          &::before {
            transform: translateX(200%);
          }

          &::after {
            transform: translateX(0);
          }

          .ask__deco {
            transform: translateX(0);
          }
        }

        &::before {
          z-index: 1;
          content: "✉️";
          font-size: 20px;
          position: absolute;
          right: 10px;
          transform: translateX(200%);
          transition: transform 0.3s ease 50ms;
        }

        &::after {
          content: "👀";
          font-size: 20px;
          position: absolute;
          right: 10px;
          transform: translateX(200%);
          transition: transform 0.3s ease 50ms;
        }
      }

      input {
        position: relative;
        z-index: 1;
        max-width: 180px;
      }

      .ask__button {
        position: relative;
        text-align: center;
        padding: 10px 18px;
        border-radius: 8px;
        border: 3px solid #5f4666;
        cursor: pointer;
        overflow: hidden;
        transition: border-color 0.3s ease;

        &:disabled {
          cursor: not-allowed;
        }

        &:hover {
          color: #f1f1f1;
          border-color: #682d9c;
          &::after {
            transform: translateX(0);
          }
        }

        &::after {
          content: "";
          position: absolute;
          width: 101%;
          height: 101%;
          top: 0;
          left: 0;
          transform: translateX(-100%);
          background-color: #513359;
          transition: transform 0.3s ease;
        }
      }

      .ask__text {
        position: relative;
        font-size: 16px;
        z-index: 1;
        transition: color 0.3s ease;
      }

      .ask__deco {
        position: absolute;
        height: 60px;
        width: 80px;
        right: 0;
        top: 0;
        overflow: hidden;
        background-color: #513359;
        transform: translateX(100%);
        transition: transform 0.3s ease;

        &::after {
          content: "";
          position: absolute;
          width: 110%;
          height: 130%;
          border-radius: 50%;
          top: -55%;
          left: -65%;
          background-color: #fff;
        }
      }

      input {
        font-size: 16px;
        background-color: inherit;
        border: none;
        outline: none;
      }

      .ball {
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: radial-gradient(#7a41ab 15%, #620d7a, #540268);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        border: 1px solid #f1f1f1;
        border-radius: 50%;
        width: 300px;
        height: 300px;
        aspect-ratio: 1;
        box-shadow: 0px 0px 50px 10px #7a41ab;
        background-color: #5f4666;
        margin-bottom: 100px;
      }

      .ball__response {
        font-size: 20px;
        font-weight: 600;
        color: #f1f1f1;
      }

      @media (max-width: 420px) {
        form {
          flex-direction: column;
        }

        .ask__button {
          inline-size: 100%;
        }
      }
    </style>
  </head>
  <body>
    <form data-form-ask>
      <label
        ><input type="text" name="askInput" /> <span class="ask__deco"></span
      ></label>
      <button class="ask__button" type="submit" data-form-submit>
        <span class="ask__text">Ask</span>
      </button>
    </form>
    <div class="ball" data-ball>
      <span class="ball__deco"></span>
      <p class="ball__response" data-response>Ask something</p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
